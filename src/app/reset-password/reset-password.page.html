<ion-content [fullscreen]="true">
  <div class="auth-container">

    <div class="auth-header">
      <div class="logo-circle">
        <ion-icon name="lock-open-outline"></ion-icon>
      </div>
      <h1>Set New Password</h1>
      <p class="subtitle">Choose a new password for {{ email }}</p>
    </div>

    <div class="auth-card">
      <form (ngSubmit)="onReset()">

        <div class="form-group">
          <ion-item lines="none" class="custom-item">
            <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">New Password *</ion-label>
            <ion-input [type]="showPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" required></ion-input>
            <ion-button slot="end" fill="clear" type="button" (click)="showPassword = !showPassword">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="form-group">
          <ion-item lines="none" class="custom-item">
            <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">Confirm Password *</ion-label>
            <ion-input [type]="showPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required></ion-input>
          </ion-item>
        </div>

        <ion-button expand="block" type="submit" size="large" class="auth-button" [disabled]="submitting || !newPassword || !confirmPassword">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Reset Password
        </ion-button>

      </form>
    </div>

  </div>
</ion-content>
