<ion-content [fullscreen]="true">
  <div class="auth-container">

    <div class="auth-header">
      <div class="logo-circle">
        <ion-icon name="key-outline"></ion-icon>
      </div>
      <h1>Forgot Password</h1>
      <p class="subtitle" *ngIf="step === 1">Enter your email to receive a reset code</p>
      <p class="subtitle" *ngIf="step === 2">Enter the code we sent to {{ email }}</p>
    </div>

    <div class="auth-card">

      <!-- Step 1: Email -->
      <form *ngIf="step === 1" (ngSubmit)="onRequestCode()">
        <div class="form-group">
          <ion-item lines="none" class="custom-item">
            <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">Email *</ion-label>
            <ion-input type="email" name="email" [(ngModel)]="email" required></ion-input>
          </ion-item>
        </div>

        <ion-button expand="block" type="submit" size="large" class="auth-button" [disabled]="submitting || !email">
          <ion-icon name="send-outline" slot="start"></ion-icon>
          Send Reset Code
        </ion-button>
      </form>

      <!-- Step 2: OTP -->
      <form *ngIf="step === 2" (ngSubmit)="onVerifyOtp()">
        <div class="form-group">
          <ion-item lines="none" class="custom-item">
            <ion-icon name="keypad-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">Verification Code *</ion-label>
            <ion-input type="text" name="otp" [(ngModel)]="otp" placeholder="Enter OTP" required></ion-input>
          </ion-item>
        </div>

        <ion-button expand="block" type="submit" size="large" class="auth-button" [disabled]="submitting || !otp">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Verify Code
        </ion-button>

        <ion-button expand="block" fill="clear" type="button" (click)="step = 1">
          Use a different email
        </ion-button>
      </form>

      <div class="divider">
        <span>Remembered your password?</span>
      </div>

      <ion-button expand="block" fill="outline" size="large" routerLink="/login" class="secondary-button">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Back to Sign In
      </ion-button>

    </div>

  </div>
</ion-content>
